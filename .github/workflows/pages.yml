name: Publish model dashboard

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Restore snapshot history
        uses: actions/cache/restore@v4
        with:
          path: |
            model-radar/history
            model-radar/snapshot.json
          key: model-radar-state-${{ github.run_id }}
          restore-keys: |
            model-radar-state-

      - name: Generate live snapshot
        run: python -m model_radar run --config config/app.yaml --output ./model-radar

      - name: Validate snapshot
        run: python -m model_radar validate ./model-radar/snapshot.json

      - name: Prepare Pages entry point
        run: |
          cp model-radar/model-radar.html model-radar/index.html
          test -s model-radar/index.html
          test -s model-radar/snapshot.json
          test -s model-radar/manifest.json

      - name: Save snapshot history
        uses: actions/cache/save@v4
        with:
          path: |
            model-radar/history
            model-radar/snapshot.json
          key: model-radar-state-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: model-radar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
