name: Publish model dashboard

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [publish]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Restore snapshot history
        uses: actions/cache/restore@v6
        with:
          path: |
            model-radar/history
            model-radar/snapshot.json
          key: model-radar-state-${{ github.run_id }}
          restore-keys: |
            model-radar-state-

      - name: Generate live snapshot
        run: python -m model_radar run --config config/app.yaml --output ./model-radar

      - name: Validate snapshot
        run: python -m model_radar validate ./model-radar/snapshot.json

      - name: Prepare Pages entry point
        run: |
          cp model-radar/model-radar.html model-radar/index.html
          test -s model-radar/index.html
          test -s model-radar/snapshot.json
          test -s model-radar/manifest.json

      - name: Save snapshot history
        uses: actions/cache/save@v6
        with:
          path: |
            model-radar/history
            model-radar/snapshot.json
          key: model-radar-state-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: model-radar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs:
      - build
      - deploy
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Model Radar daily publish failed"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')
          body="The Model Radar publish workflow failed. See $RUN_URL"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
