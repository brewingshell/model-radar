name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check types
        run: python -m mypy src

      - name: Run offline fixture smoke test
        run: |
          output_dir="$(mktemp -d)"
          python -m distill run \
            --config config/fixture.yaml \
            --output "$output_dir" \
            --source fixture \
            --generated-at 2026-09-21T00:00:00+00:00
          python -m distill validate "$output_dir/snapshot.json"
          test -s "$output_dir/distill.html"
          test -s "$output_dir/manifest.json"
