[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model-radar"
version = "0.1.0"
description = "Snapshot-only model landscape analysis with a self-contained HTML report"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "BrewingShell", email = "nikolche.kolevski@gmail.com" }]
keywords = ["llm", "benchmarks", "leaderboard", "artificial-analysis", "huggingface"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.7",
  "click>=8.1",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "textual>=0.60",
  "ruamel.yaml>=0.18",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
model-radar = "model_radar.cli:main"

[project.urls]
Homepage = "https://github.com/brewingshell/model-radar"
Repository = "https://github.com/brewingshell/model-radar"
Issues = "https://github.com/brewingshell/model-radar/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_radar = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
