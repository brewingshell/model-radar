[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-radar"
version = "0.1.0"
description = "Snapshot-only current-state model analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "polars>=1.0",
  "rapidfuzz>=3.9",
  "click>=8.1",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "textual>=0.60",
  "ruamel.yaml>=0.18",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "hypothesis>=6.100",
  "playwright>=1.45",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
model-radar = "model_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
